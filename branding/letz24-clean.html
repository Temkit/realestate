<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lëtz24 — Logo</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f6f7f9; --ink:#111418; --muted:#8a9099; --line:#e7e9ee;
    --blue:#2563eb;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0d0f12; --panel:#15181d; --ink:#f2f4f7; --muted:#8a929d; --line:#22262d; --blue:#5c8cff;
  }}
  :root[data-theme="light"]{--bg:#fff;--panel:#f6f7f9;--ink:#111418;--muted:#8a9099;--line:#e7e9ee;--blue:#2563eb;}
  :root[data-theme="dark"]{--bg:#0d0f12;--panel:#15181d;--ink:#f2f4f7;--muted:#8a929d;--line:#22262d;--blue:#5c8cff;}

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;}
  .toggle{position:fixed;top:16px;right:18px;display:inline-flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;}
  .toggle button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;}
  .toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg);}

  /* one tight wordmark */
  .logo{font-family:var(--font);font-weight:800;letter-spacing:-.055em;line-height:1;}
  .logo .accent{color:var(--blue);}

  .hero{min-height:62vh;display:flex;align-items:center;justify-content:center;width:100%;}
  .hero .logo{font-size:clamp(56px,15vw,150px);}

  .row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:8px 20px 8px;width:100%;max-width:960px;}
  .cell{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
        min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;}
  .cell.dark{background:var(--ink);}
  .cell .logo{font-size:34px;}
  .cell.dark .logo{color:#fff;} .cell.dark .accent{color:#fff;}
  .cap{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
  .cell.dark .cap{color:#aeb6c2;}

  /* app icon: solid square, real ë */
  .mark{width:96px;height:96px;border-radius:22px;background:var(--blue);color:#fff;
        display:grid;place-items:center;font-weight:800;font-size:56px;letter-spacing:-.04em;}
  .mark.sm{width:40px;height:40px;border-radius:10px;font-size:24px;}
  .mark.xs{width:20px;height:20px;border-radius:5px;font-size:12px;}

  section{width:100%;max-width:960px;padding:34px 20px;}
  h2{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0 0 20px;}
  .sizes{display:flex;align-items:end;gap:26px;justify-content:center;}
  .foot{color:var(--muted);font-size:13px;text-align:center;padding:10px 20px 60px;}
</style>
</head>
<body>
  <div class="toggle" role="group" aria-label="Theme">
    <button type="button" data-set="light" aria-pressed="false">Light</button>
    <button type="button" data-set="dark" aria-pressed="false">Dark</button>
  </div>

  <div class="hero">
    <span class="logo">lëtz<span class="accent">24</span></span>
  </div>

  <section>
    <h2>Colour options</h2>
    <div class="row">
      <div class="cell"><span class="logo">lëtz<span class="accent">24</span></span><span class="cap">Ink + blue “24”</span></div>
      <div class="cell"><span class="logo">lëtz24</span><span class="cap">Mono · ink</span></div>
      <div class="cell dark"><span class="logo">lëtz24</span><span class="cap">Reversed</span></div>
    </div>
  </section>

  <section>
    <h2>App icon &amp; favicon</h2>
    <div class="sizes">
      <div class="mark">ë</div>
      <div class="mark sm">ë</div>
      <div class="mark xs">ë</div>
    </div>
  </section>

  <div class="foot">lëtz24 — one word, one accent. Say the word and I export the SVG + favicon set.</div>

<script>
  (function(){
    var root=document.documentElement, btns=document.querySelectorAll('.toggle button');
    function sync(){var t=root.getAttribute('data-theme');var d=t==='dark'||(!t&&matchMedia('(prefers-color-scheme:dark)').matches);
      btns.forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.set===(d?'dark':'light')));});}
    btns.forEach(function(b){b.addEventListener('click',function(){root.setAttribute('data-theme',b.dataset.set);sync();});});
    sync();
  })();
</script>
</body>
</html>
